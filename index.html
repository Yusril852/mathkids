<!doctype html><html lang="id" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Matematika SD</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10231f;--bg:#f2f7f5;--card:#fff;--ln:#d9e5e0;--y:#f5a524;--g:#16a34a;--r:#e5484d;--b:#0f766e;--bt:#fff;--m:#587069;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8f3ef;--bg:#0b1714;--card:#13251f;--ln:#244039;--b:#2dd4bf;--bt:#04201c;--m:#9bb5ad}}
:root[data-theme=dark]{--ink:#e8f3ef;--bg:#0b1714;--card:#13251f;--ln:#244039;--b:#2dd4bf;--bt:#04201c;--m:#9bb5ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,.big,.q{font-family:Sora,'DM Sans',sans-serif;margin:0;line-height:1.25}h1{font-size:1.6rem}h2{font-size:1.15rem;margin:24px 0 10px}
#sb{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:4px;padding:10px max(16px,calc(50% - 440px));background:var(--bg);border-bottom:1px solid var(--ln);overflow-x:auto}
#sb .lg{font:700 1.1rem Sora,sans-serif;margin-right:auto;white-space:nowrap}#sb .lg i{font-style:normal;color:var(--b)}
#sb button{all:unset;cursor:pointer;padding:8px 14px;border-radius:99px;font-weight:600;font-size:.9rem;color:var(--m);white-space:nowrap}#sb button.on{background:var(--b);color:var(--bt)}
main{max-width:880px;margin:0 auto;padding:22px 16px 56px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.grid .card{margin:0}
.big{font-size:1.8rem;font-weight:700}.mu{color:var(--m);font-size:.9rem}
.hero{padding:22px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#0f766e,#34b27b);margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.hero p{margin:6px 0 0;opacity:.92}.lv{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 16px;font:700 1.3rem Sora,sans-serif;white-space:nowrap}
.btn{all:unset;cursor:pointer;background:var(--b);color:var(--bt);font-weight:700;padding:11px 20px;border-radius:99px;display:inline-block;text-align:center}.btn:focus-visible,.opt:focus-visible,#sb button:focus-visible{outline:3px solid var(--y)}
.btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}.btn.y{background:var(--y);color:#2b1c00}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.opt{all:unset;display:block;cursor:pointer;width:100%;border:1.5px solid var(--ln);border-radius:14px;padding:14px 18px;margin-bottom:10px;font-weight:500;background:var(--card)}
.opt:hover{border-color:var(--b)}.opt.ok{border-color:var(--g);background:rgba(22,163,74,.15)}.opt.no{border-color:var(--r);background:rgba(229,72,77,.14)}
.q{font-size:1.15rem;font-weight:600;line-height:1.5;margin:10px 0 16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.fb{border-radius:14px;padding:12px 16px;margin:8px 0}.fb.ok{background:rgba(22,163,74,.15)}.fb.no{background:rgba(229,72,77,.14)}
.inp{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);font:500 1.05rem 'DM Sans',sans-serif;margin:12px 0}
details{margin:8px 0}summary{cursor:pointer;color:var(--b);font-weight:600}table{border-collapse:collapse;margin:6px auto}td{padding:6px 18px;border:1px solid var(--ln)}
.gfx{text-align:center;margin:6px auto;max-width:360px;color:var(--ink)}.gfx svg{max-width:100%;height:auto}
@media(max-width:800px){.hero{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:root[data-theme=light]{--bg:#fff8e7;--ink:#2d2a4a;--card:#fff;--ln:#f0dfb8;--b:#ff7a45;--bt:#fff;--m:#6b6785;--g:#2bb673;--y:#ffc233;--r:#ef5b5b}
body{font-family:Nunito,system-ui,sans-serif;font-size:18px;font-weight:600;background:var(--bg) radial-gradient(circle at 20px 20px,#ffe9a8 3px,transparent 4px) 0 0/44px 44px}
h1,h2,.big,.q,#sb .lg,.lv,.btn{font-family:Fredoka,Nunito,sans-serif}
.card{border:3px solid var(--ln);border-radius:26px;box-shadow:0 5px 0 var(--ln)}
.btn{border-radius:20px;padding:14px 22px;font-size:1.05rem;box-shadow:0 5px 0 #c8501f}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c8501f}
.btn.s{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ln)}.btn.y{background:var(--y);box-shadow:0 5px 0 #c98f00}
.btn.lvb{display:inline-flex;flex-direction:column;align-items:center;min-width:130px}.btn.lvb small{font:700 .8rem Nunito}.lvb.l1{background:#2bb673;box-shadow:0 5px 0 #1a8a54}.lvb.l2{background:#3b9cff;box-shadow:0 5px 0 #1f6fc4}.lvb.l3{background:#9b5de5;box-shadow:0 5px 0 #6d35b0}
.opt{border:3px solid var(--ln);border-radius:20px;padding:16px 20px;font-size:1.15rem;box-shadow:0 4px 0 var(--ln)}
.q{font-size:1.4rem}.hero{background:linear-gradient(135deg,#ff7a45,#ffb347);border-radius:30px}.hero::after{content:"🦌";font-size:4rem}
.bar{height:16px;border-radius:12px}.bar i{background:repeating-linear-gradient(45deg,#2bb673,#2bb673 10px,#4cd698 10px,#4cd698 20px)}
#sb{background:#ffe08a}#sb button.on{background:var(--b);color:#fff}.ex{background:#fff3c9;border-radius:14px;padding:10px 14px}.tw{overflow-x:auto}
#cr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px max(16px,calc(50% - 440px));font:600 .74rem Nunito,sans-serif;color:var(--m);background:#fff3c9}#cr a{display:inline-flex;align-items:center;gap:5px;color:inherit;text-decoration:none}#cr a:hover{color:var(--b)}
.btn.sm{padding:7px 14px;font-size:.9rem;box-shadow:0 3px 0 #c8501f;display:inline-block}
.tw table{width:100%;margin:0}.tw td,.tw th{white-space:nowrap}
th{padding:6px 14px;border:1px solid var(--ln);background:#fff3c9;text-align:left;font-size:.85rem}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:800}.bd.on{background:rgba(43,182,115,.2);color:#1a8a54}.bd.off{background:var(--ln);color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff3c9;border:2px solid var(--ln);border-radius:99px;padding:6px 8px 6px 14px;cursor:pointer;font-size:.9rem;font-weight:700;color:var(--ink)}
.chip:hover,.chip:focus-visible{border-color:var(--b);outline:none}.chip small{color:var(--m);font-weight:600}.chip button{all:unset;cursor:pointer;padding:0 6px;color:var(--m)}
select.inp{appearance:auto}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2d2a4a;color:#fff;padding:12px 20px;border-radius:16px;z-index:50;font-weight:700;max-width:90vw;text-align:center}
</style></head><body><div id=cr><span>Dibuat oleh: Yusril Ainul Yakin, S.Pd</span><a href="https://github.com/Yusril852" target=_blank rel=noopener aria-label="GitHub Yusril852"><svg viewBox="0 0 16 16" width=14 height=14 fill=currentColor aria-hidden=true><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Yusril852</a></div><nav id="sb"></nav><main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
let LV=1;const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*((b-a)*[.6,.8,1][LV-1]+1)),pick=a=>a[Math.floor(Math.random()*a.length)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const gcd=(a,b)=>b?gcd(b,a%b):a,fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d==1?''+n:n+'/'+d},fmt=n=>(Math.round(n*100)/100).toString().replace('.',','),p=x=>x<0?`(${x})`:x;
function Q(q,a,e,w,g){const f=x=>typeof x=='number'?fmt(x):''+x;a=f(a);const n=parseFloat(a.replace(',','.'));w=(w||[1,-1,2,-2,10,-10].map(d=>n+d)).map(f);w=[...new Set(w)].filter(x=>x!=a&&(n<0||isNaN(n)||x[0]!='-'));const sf=a.endsWith('%')?'%':'';for(let d=3;w.length<3&&!isNaN(n)&&/^-?[\d,.]+%?$/.test(a)&&d<40;d++){const x=f(n+d)+sf;if(x!=a&&!w.includes(x))w.push(x)}return{q,a,e:e||'Jawaban yang tepat adalah '+a+'. Baca lagi ringkasan materinya.',g:g||'',o:sh([a,...sh(w).slice(0,3)])}}
const bk=a=>()=>{const[x,y,w,e]=pick(a);return Q(x,y,e,w)};
const tf=(h,m)=>String(h).padStart(2,'0')+'.'+String(m).padStart(2,'0');
const clk=(h,m)=>{const ln=(d,l,s)=>`<line x1=50 y1=50 x2=${50+l*Math.sin(d*Math.PI/180)} y2=${50-l*Math.cos(d*Math.PI/180)} stroke=currentColor stroke-width=${s} stroke-linecap=round />`;return`<svg viewBox="0 0 100 100" width=150><circle cx=50 cy=50 r=47 fill=none stroke=currentColor stroke-width=3 />${Array.from({length:12},(_,i)=>`<text x=${50+37*Math.sin((i+1)*Math.PI/6)} y=${54-37*Math.cos((i+1)*Math.PI/6)} font-size=10 text-anchor=middle fill=currentColor>${i+1}</text>`).join('')}${ln((h%12+m/60)*30,24,5)}${ln(m*6,36,3)}</svg>`};
const chart=(l,v,t)=>{const W=l.length*50+30;return`<svg viewBox="0 0 ${W} 135" width=100%>`+[0,2,4,6,8,10].map(k=>`<text x=22 y=${113-k*10} font-size=9 text-anchor=end fill=currentColor>${k}</text><line x1=26 x2=${W} y1=${110-k*10} y2=${110-k*10} stroke=currentColor opacity=.15 />`).join('')+(t=='l'?`<polyline fill=none stroke=var(--b) stroke-width=3 points="${v.map((x,i)=>`${50+i*50},${110-x*10}`).join(' ')}"/>${v.map((x,i)=>`<circle cx=${50+i*50} cy=${110-x*10} r=4 fill=var(--b) />`).join('')}`:v.map((x,i)=>`<rect x=${32+i*50} y=${110-x*10} width=36 height=${x*10} fill=var(--b) rx=4 />`).join(''))+l.map((x,i)=>`<text x=${50+i*50} y=128 text-anchor=middle font-size=11 fill=currentColor>${x}</text>`).join('')+'</svg>'};
const tb=r=>'<table>'+r.map(x=>`<tr><td>${x[0]}<td>${x[1]}`).join('')+'</table>';
const DY=['Sen','Sel','Rab','Kam','Jum'];
const T={
1:[
{n:'Bilangan sampai 20',m:'Bilangan cacah 0–20 bisa dibaca, ditulis, dibandingkan, dan diurutkan. Bilangan yang lebih ke kanan pada garis bilangan lebih besar.',g:()=>{let a=R(1,19),b=R(1,20);while(a==b)b=R(1,20);const M=Math.max(a,b),m=Math.min(a,b);return pick([Q(`Mana yang lebih besar: ${a} atau ${b}?`,M,'Yang lebih ke kanan pada garis bilangan lebih besar.',[m,M+1,m-1]),Q(`Mana yang lebih kecil: ${a} atau ${b}?`,m,'Yang lebih ke kiri lebih kecil.',[M,m-1,M+1]),Q(`Bilangan setelah ${a} adalah...`,a+1,'Setelah berarti ditambah 1.'),Q(`Bilangan sebelum ${a} adalah...`,a-1,'Sebelum berarti dikurangi 1.')])}},
{n:'Penjumlahan & pengurangan sampai 20',m:'Menjumlah berarti menggabungkan. Mengurangi berarti mengambil sebagian. Gunakan garis bilangan: maju untuk tambah, mundur untuk kurang.',g:()=>{const a=R(1,19),b=R(1,20-a),x=R(2,20),y=R(1,x-1);return pick([Q(`${a} + ${b} = ...`,a+b,`Hitung maju ${b} dari ${a}.`),Q(`${x} − ${y} = ...`,x-y,`Hitung mundur ${y} dari ${x}.`)])}},
{n:'Bangun datar & bangun ruang',m:'Bangun datar: segitiga (3 sisi), segi empat (4 sisi), lingkaran (tidak bersudut). Bangun ruang: kubus, balok, bola.',g:bk([['Bangun datar yang punya 3 sisi adalah...','Segitiga',['Lingkaran','Persegi','Kubus']],['Roda sepeda berbentuk...','Lingkaran',['Segitiga','Persegi','Kubus']],['Dadu berbentuk...','Kubus',['Bola','Balok','Segitiga']],['Kotak sepatu berbentuk...','Balok',['Bola','Kubus','Lingkaran']],['Bola basket berbentuk...','Bola',['Kubus','Balok','Segitiga']],['Bangun datar yang punya 4 sisi adalah...','Segi empat',['Segitiga','Lingkaran','Bola']]])},
{n:'Satuan tidak baku',m:'Panjang dapat diukur dengan jengkal atau langkah. Hasilnya berbeda untuk tiap orang karena ukuran jengkal dan langkah tidak sama.',g:bk([['Meja diukur dengan jengkal Ani: 5 jengkal. Jika diukur dengan jengkal Budi yang lebih panjang, hasilnya...','Kurang dari 5',['Lebih dari 5','Tetap 5','Tidak bisa diukur'],'Jengkal lebih panjang, jadi jumlah jengkal lebih sedikit.'],['Alat ukur tidak baku adalah...','Jengkal',['Penggaris','Meteran','Timbangan']],['Untuk mengukur panjang lorong tanpa penggaris, kita bisa memakai...','Langkah kaki',['Gram','Liter','Jam']],['Mengapa hasil ukur dengan jengkal bisa berbeda?','Jengkal tiap orang tidak sama panjang',['Meja berubah','Angkanya salah','Jengkal selalu sama']]])},
{n:'Pola bilangan & bentuk',m:'Pola adalah susunan yang berulang atau beraturan. Cari aturan bertambah atau pengulangannya.',g:()=>{const s=R(1,6),d=R(1,4),e=pick([['🔺','🔵'],['⭐','🌙'],['🍎','🍌']]);return pick([Q(`Lanjutkan pola: ${s}, ${s+d}, ${s+2*d}, ${s+3*d}, ...`,s+4*d,`Pola bertambah ${d} setiap langkah.`),Q(`Gambar berikutnya: ${[e[0],e[1],e[0],e[1],e[0]].join(' ')} ...`,e[1],'Pola berulang bergantian.',[e[0],'🟩','⬜'])])}}],
2:[
{n:'Bilangan sampai 100',m:'Bilangan dua angka punya puluhan dan satuan. Contoh: 47 = 4 puluh + 7 satuan.',g:()=>{const n=R(11,99),t=Math.floor(n/10),u=n%10;return pick([Q(`Nilai angka ${t} pada bilangan ${n} adalah...`,t*10,`Angka ${t} ada di tempat puluhan, nilainya ${t*10}.`,[t,n,t*100]),Q(`${t} puluh dan ${u} satuan membentuk bilangan...`,n,`${t}×10 + ${u} = ${n}.`,[u*10+t,n+10,n+1])])}},
{n:'Penjumlahan & pengurangan bersusun',m:'Tulis angka sejajar menurut nilai tempat. Menyimpan: jika satuan ≥ 10, simpan 1 puluhan. Meminjam: jika satuan atas lebih kecil, pinjam 1 puluhan.',g:()=>{const au=R(5,9),bu=R(5,9),a=R(1,4)*10+au,b=R(1,4)*10+bu,bt=R(1,3),bu2=R(5,9),at=R(bt+1,8),au2=R(0,bu2-1),c=at*10+au2,d=bt*10+bu2;return pick([Q(`${a} + ${b} = ...`,a+b,`Satuan ${au}+${bu}=${au+bu}, simpan 1 puluhan.`),Q(`${c} − ${d} = ...`,c-d,`Satuan ${au2} kurang dari ${bu2}, pinjam 1 puluhan.`)])}},
{n:'Pecahan dasar',m:'Pecahan menyatakan bagian dari keseluruhan. Jika dibagi 4 sama besar, satu bagian = 1/4.',g:()=>{const n=pick([2,3,4]);return pick([Q(`Sebuah kue dibagi ${n} bagian sama besar. Satu bagiannya adalah...`,'1/'+n,`Satu dari ${n} bagian = 1/${n}.`,['1/'+(n+1),'1/'+(n+2),'2/'+(n+1)]),Q('Mana yang lebih besar?','1/2','Makin kecil penyebut, makin besar bagiannya.',['1/3','1/4','1/5'])])}},
{n:'Membaca waktu',m:'Jarum pendek menunjuk jam, jarum panjang menunjuk menit. Jarum panjang di 6 berarti 30 menit.',g:()=>{const h=R(1,12),m=pick([0,15,30,45]);return Q('Pukul berapa yang ditunjukkan jam ini?',tf(h,m),'Jarum pendek = jam, jarum panjang = menit (angka × 5).',[tf(h,(m+15)%60),tf(h%12+1,m),tf((h+1)%12+1,m)],clk(h,m))}},
{n:'Satuan baku (cm, m, g, kg)',m:'1 m = 100 cm. 1 kg = 1.000 gram.',g:()=>{const n=R(1,9);return pick([Q(`${n} m = ... cm`,n*100,'Kalikan 100.',[n*10,n*1000,n]),Q(`${n} kg = ... gram`,n*1000,'Kalikan 1.000.',[n*100,n*10,n]),Q(`${n*100} cm = ... m`,n,'Bagi 100.',[n*10,n*100,n+1])])}}],
3:[
{n:'Bilangan sampai 1.000',m:'Bilangan tiga angka punya ratusan, puluhan, satuan.',g:()=>{const n=R(100,999),h=Math.floor(n/100),a=R(100,500),b=R(100,400);return pick([Q(`Nilai angka ${h} pada ${n} adalah...`,h*100,`Angka ${h} ada di tempat ratusan.`,[h*10,h,h*1000]),Q(`${a} + ${b} = ...`,a+b,'Jumlahkan dari satuan, puluhan, lalu ratusan.')])}},
{n:'Perkalian & pembagian',m:'Perkalian adalah penjumlahan berulang: 3×4 = 4+4+4. Pembagian adalah kebalikan perkalian.',g:()=>{const a=R(2,9),b=R(2,9);return pick([Q(`${a} × ${b} = ...`,a*b,`${a} dijumlahkan ${b} kali.`),Q(`${a*b} ÷ ${b} = ...`,a,`Karena ${a} × ${b} = ${a*b}.`)])}},
{n:'Pecahan senilai & membandingkan',m:'Pecahan senilai: kalikan pembilang dan penyebut dengan bilangan yang sama. Penyebut sama: pembilang lebih besar, pecahan lebih besar.',g:()=>{const d=R(2,5),n=R(1,d-1),k=R(2,4);let a=R(1,8),b=R(1,8);while(a==b)b=R(1,8);const D=R(9,12),M=Math.max(a,b),m=Math.min(a,b);return pick([Q(`${n}/${d} = .../${d*k}`,n*k,`Kalikan pembilang dan penyebut dengan ${k}.`),Q(`Mana yang lebih besar: ${a}/${D} atau ${b}/${D}?`,`${M}/${D}`,'Penyebut sama, lihat pembilangnya.',[`${m}/${D}`,`${M+1}/${D}`,`${m+1}/${D}`])])}},
{n:'Simetri lipat & putar',m:'Simetri lipat: banyaknya cara melipat sehingga dua bagian tepat menutup. Simetri putar: bangun menempati bingkainya saat diputar kurang dari 360°.',g:bk([['Banyak simetri lipat persegi adalah...','4',['1','2','8']],['Banyak simetri lipat persegi panjang adalah...','2',['1','4','3']],['Banyak simetri lipat segitiga sama sisi adalah...','3',['1','2','6']],['Banyak simetri putar persegi (satu putaran penuh) adalah...','4',['1','2','8']]])},
{n:'Keliling & luas persegi/persegi panjang',m:'Persegi: K = 4×s, L = s×s. Persegi panjang: K = 2×(p+l), L = p×l.',g:()=>{const s=R(2,12),pj=R(5,15),l=R(2,pj-1);return pick([Q(`Keliling persegi dengan sisi ${s} cm adalah ... cm`,4*s,`K = 4 × ${s}.`),Q(`Luas persegi dengan sisi ${s} cm adalah ... cm²`,s*s,`L = ${s} × ${s}.`,[4*s,2*s,s*s+s]),Q(`Persegi panjang ${pj} cm × ${l} cm. Luasnya ... cm²`,pj*l,`L = ${pj} × ${l}.`,[2*(pj+l),pj+l,pj*l+pj]),Q(`Persegi panjang ${pj} cm × ${l} cm. Kelilingnya ... cm`,2*(pj+l),`K = 2 × (${pj}+${l}).`,[pj*l,pj+l,2*pj*l])])}},

{n:'Perbandingan, skala & koordinat',m:'Skala 1:200.000 berarti 1 cm di peta = 200.000 cm asli. Koordinat ditulis (x, y): x ke kanan, y ke atas.',g:()=>{const s=pick([100000,200000,500000]),j=R(2,9),k=R(2,6),x=R(1,6),y=R(1,6),d=R(1,3);return pick([Q(`Skala peta 1 : ${s.toLocaleString('id-ID')}. Jarak di peta ${j} cm. Jarak sebenarnya ... km`,j*s/100000,`${j} × ${s.toLocaleString('id-ID')} cm, lalu ubah ke km (÷100.000).`),Q(`Perbandingan kelereng Ani dan Budi 2 : 3. Jika Ani punya ${2*k}, Budi punya...`,3*k,`Tiap bagian = ${k}, Budi 3 bagian.`),Q(`Titik A(${x}, ${y}) digeser ${d} satuan ke kanan. Koordinat barunya...`,`(${x+d}, ${y})`,'Ke kanan menambah nilai x.',[`(${x}, ${y+d})`,`(${x-d}, ${y})`,`(${y}, ${x+d})`])])}},
{n:'Kecepatan & debit',m:'Kecepatan = jarak ÷ waktu. Jarak = kecepatan × waktu. Debit = volume ÷ waktu.',g:()=>{const v=R(2,12)*10,t=R(2,5),w=R(5,40);return pick([Q(`Mobil melaju ${v} km/jam selama ${t} jam. Jaraknya ... km`,v*t,`${v} × ${t}.`),Q(`Jarak ${v*t} km ditempuh dalam ${t} jam. Kecepatannya ... km/jam`,v,`${v*t} ÷ ${t}.`),Q(`Air ${w*t} liter mengalir selama ${t} menit. Debitnya ... liter/menit`,w,`${w*t} ÷ ${t}.`)])}},

{n:'Volume kubus & balok',m:'Volume kubus = s×s×s. Volume balok = p×l×t.',g:()=>{const s=R(2,9),a=R(2,9),b=R(2,9),c=R(2,9);return pick([Q(`Volume kubus rusuk ${s} cm adalah ... cm³`,s**3,`${s}×${s}×${s}.`,[s*s,3*s,s**3+s]),Q(`Volume balok ${a}×${b}×${c} cm adalah ... cm³`,a*b*c,'p × l × t.',[a+b+c,a*b+c,a*b*c+a]),Q(`Volume kubus ${s**3} cm³. Panjang rusuknya ... cm`,s,`${s}×${s}×${s} = ${s**3}.`)])}},

{n:'Lingkaran',m:'Unsur: titik pusat, jari-jari (r), diameter (d=2r), busur, tali busur. K = 2πr, L = πr². π = 22/7 atau 3,14.',g:()=>{const k=R(1,3),r=7*k;return pick([Q(`Keliling lingkaran r = ${r} cm (π = 22/7) adalah ... cm`,44*k,`2 × 22/7 × ${r}.`,[22*k,154*k,88*k]),Q(`Luas lingkaran r = ${r} cm (π = 22/7) adalah ... cm²`,154*k*k,`22/7 × ${r} × ${r}.`,[44*k,22*k*k,308*k*k]),Q('Garis dari titik pusat ke tepi lingkaran disebut...','Jari-jari',null,['Diameter','Busur','Tali busur']),Q('Tali busur yang melalui titik pusat disebut...','Diameter',null,['Jari-jari','Busur','Juring']),Q('Keliling lingkaran r = 10 cm (π = 3,14) adalah ... cm',62.8,'2 × 3,14 × 10.',[31.4,314,6.28])])}},
{n:'Bangun ruang',m:'Prisma V = luas alas × t. Tabung V = πr²t. Kerucut V = ⅓πr²t. Bola V = 4/3πr³. Luas permukaan kubus = 6s².',g:()=>{const t=R(2,10),t3=3*R(1,4),a=R(2,6)*2,h=R(2,6),s=R(2,9);return pick([Q(`Volume tabung r = 7 cm, t = ${t} cm (π = 22/7) adalah ... cm³`,154*t,`22/7 × 49 × ${t}.`,[44*t,154*t+154,22*t]),Q(`Volume kerucut r = 7 cm, t = ${t3} cm (π = 22/7) adalah ... cm³`,154*t3/3,`⅓ × 22/7 × 49 × ${t3}.`,[154*t3,154*t3/3+154,44*t3/3]),Q('Volume bola r = 21 cm (π = 22/7) adalah ... cm³',38808,'4/3 × 22/7 × 21³.',[12936,9702,116424]),Q(`Prisma alas segitiga (alas ${a} cm, tinggi ${h} cm), tinggi prisma 10 cm. Volumenya ... cm³`,a*h/2*10,`(½×${a}×${h}) × 10.`,[a*h*10,a*h/2,a*h+10]),Q(`Luas permukaan kubus rusuk ${s} cm adalah ... cm²`,6*s*s,`6 × ${s}².`,[4*s*s,s**3,6*s])])}},
{n:'Statistika: mean, median, modus',m:'Mean = jumlah ÷ banyak data. Median = nilai tengah setelah diurutkan. Modus = nilai paling sering muncul.',g:()=>{let v=[R(2,10),R(2,10),R(2,10),R(2,10)];let l=(5-v.reduce((s,x)=>s+x,0)%5)%5||5;v.push(l);const so=[...v].sort((x,y)=>x-y),mn=v.reduce((s,x)=>s+x,0)/5,m=R(1,9),mo=sh([m,m,m,...sh([1,2,3,4,5,6,7,8,9].filter(x=>x!=m)).slice(0,4)]);return pick([Q(`Rata-rata dari ${v.join(', ')} adalah...`,mn,`Jumlah ${v.reduce((s,x)=>s+x,0)} ÷ 5.`),Q(`Median dari ${v.join(', ')} adalah...`,so[2],`Urutan: ${so.join(', ')}. Nilai tengah = ${so[2]}.`),Q(`Modus dari ${mo.join(', ')} adalah...`,m,`${m} muncul paling sering (3 kali).`)])}},

sk:()=>{const s=pick([100000,200000,500000]),j=R(2,9),k=R(2,6),S2=s.toLocaleString('id-ID');return pick([Q(`Di peta berskala 1 : ${S2}, jarak dua desa di Kendal ${j} cm. Jarak sebenarnya ... km`,j*s/100000,`${j} × ${S2} cm = ${j*s} cm = ${j*s/100000} km.`),Q(`Perbandingan bandeng dan udang di tambak 3 : 2. Jika bandeng ${3*k} ekor, udangnya ... ekor`,2*k,`Satu bagian = ${3*k} ÷ 3 = ${k}. Udang = 2 × ${k}.`)])},

const CXM={1:['cmp','as',0,0,0],2:[0,'as','pec','wk','un'],3:['as','md','pec',0,'kel','tb'],4:['as','fk','pr',0,'kel'],5:['fo','sk','kc',0,'vo','bar'],6:['ib','pr','lg',0,0,'bar']};
const mk=(g,i,L)=>{LV=L;const pool=i==null?T[g].map((_,j)=>j):[i],qs=[],seen=new Set;for(let n=0;n<1800&&qs.length<25;n++){if(n==600)LV=Math.min(3,L+1);if(n==1200)LV=3;const j=pick(pool),b=CXM[g][j],q=b&&Math.random()<[.3,.6,.85][L-1]?CB[b](g):T[g][j].g(),k=q.q+q.g;if(!seen.has(k)){seen.add(k);q.j=j;qs.push(q)}}return qs};
function start(g,i,L){if(S.cur&&!confirm('Ada sesi yang belum selesai. Mulai sesi baru dan hapus sesi lama?'))return;P={g,i,L,qs:mk(g,i,L),k:0,ok:0,a:null};go('play')}

function snap(){if(!S||!P||P.done||V!='play')return;S.cur={g:P.g,i:P.i==null?-1:P.i,L:P.L,k:P.k,ok:P.ok,a:P.a==null?-1:P.a,qs:P.qs,ts:Date.now()}}
function lanjut(){const c=S&&S.cur;if(!c)return;const qs=toArr(c.qs).map(q=>Object.assign({},q,{o:toArr(q.o),g:q.g||'',e:q.e||''}));if(!qs.length||!T[c.g]||(c.i>=0&&!T[c.g][c.i])){S.cur=null;sv();return render()}
P={g:c.g,i:c.i<0?null:c.i,L:c.L,qs,k:Math.min(c.k||0,qs.length-1),ok:c.ok||0,a:c.a<0?null:c.a};go('play')}
function buang(){if(confirm('Hapus sesi yang belum selesai? Soal yang sudah dijawab tetap tercatat di progress.')){S.cur=null;sv();render()}}
const cl=(g,i,L)=>{const c=S&&S.cur;return c&&c.g==g&&c.i==i&&c.L==L?c:null};
const curCard=()=>{const c=S&&S.cur;if(!c||!T[c.g])return'';const n=toArr(c.qs).length,k=(c.k||0)+(c.a>=0?1:0),w='Kelas '+c.g+' · '+(c.i<0?'Ulangan campuran':(T[c.g][c.i]?T[c.g][c.i].n:'Latihan')+' · '+(LN[c.L]||''));
return`<div class=card style="border:2px solid var(--y)"><b>▶️ Ada sesi yang belum selesai</b><div class=mu>${esc(w)} · sudah ${k} dari ${n} soal · ${new Date(c.ts||0).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})}</div><div class=row style="margin-top:10px"><button class="btn y" onclick=lanjut()>▶️ Lanjutkan</button><button class="btn s" onclick=buang()>Hapus sesi</button></div></div>`};
function next(){P.k++;if(P.k<P.qs.length){P.a=null;return go('play')}const sc=Math.round(P.ok/P.qs.length*100);P.sc=sc;P.done=1;S.cur=null;S.xp+=sc==100?50:20;if(P.i!=null){const key=P.g+'.'+P.i+'.'+P.L;S.p[key]=Math.max(S.p[key]||0,sc)}const d=day(new Date);if(!S.days.includes(d))S.days.push(d);if(sc==100)S.perf=1;S.hist.push({d:new Date().toISOString(),g:P.g,i:P.i==null?-1:P.i,L:P.L,sc,ok:P.ok,n:P.qs.length,t:P.i==null?'Ulangan campuran':T[P.g][P.i].n});if(S.hist.length>100)S.hist.splice(0,S.hist.length-100);sv();go('res')}

const ago=t=>{if(!t)return'–';const x=Math.max(0,(nowS()-t)/1000);if(x<60)return'baru saja';if(x<3600)return Math.floor(x/60)+' mnt lalu';if(x<86400)return Math.floor(x/3600)+' jam lalu';return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'})};

const ws=d.wrong.slice().sort((a,b)=>b.n-a.n||(a.d<b.d?1:-1)).slice(0,20).map(w=>`<tr><td>K${w.g} · ${esc(String(w.t))}<td style="white-space:normal">${esc(String(w.q))}${w.gf?' 🖼️':''}<td>${esc(String(w.a))}<td>${w.n}×`).join('');
return nav+`<div class=card><div class="row sp"><div><h1>${esc(String(d.name))}</h1><div class=mu>${esc(String(d.sekolah))} · Kelas ${d.kelas}</div></div><span id=gds>${stBadge(k)}</span></div></div><div class=grid><div class=card><div class=big>${d.xp||0}</div><div class=mu>XP · Level ${Math.floor((d.xp||0)/100)+1}</div></div><div class=card><div class=big>${d.tot||0}</div><div class=mu>soal dikerjakan</div></div><div class=card><div class=big>${d.tot?ac+'%':'–'}</div><div class=mu>akurasi</div></div><div class=card><div class=big>🔥 ${stk(d.days)}</div><div class=mu>hari beruntun</div></div></div><h2>Perlu bimbingan</h2><div class=card>${low.join('; ')||'Belum ada materi dengan akurasi di bawah 60% (minimal 5 soal).'}</div><h2>Akurasi per bab dan level</h2><div class="card tw"><table><tr><th>Materi<th>Level 1<th>Level 2<th>Level 3${rows.join('')||'<tr><td colspan=4 class=mu>Belum ada latihan.'}</table></div><h2>Riwayat ulangan (30 terakhir)</h2><div class="card tw"><table><tr><th>Waktu<th>Materi<th>Level<th>Skor${hs||'<tr><td colspan=4 class=mu>Belum ada riwayat.'}</table></div><h2>Soal yang salah (paling sering di atas)</h2><div class="card tw"><table><tr><th>Materi<th>Soal<th>Jawaban benar<th>Salah${ws||'<tr><td colspan=4 class=mu>Belum ada soal salah.'}</table></div>`};
W.val=()=>{let tot=0,bad=[];for(let g=1;g<=6;g++)T[g].forEach((t,i)=>[1,2,3].forEach(L=>{const qs=mk(g,i,L);tot+=qs.length;if(qs.length<25)bad.push(`K${g} ${t.n} L${L}: hanya ${qs.length} soal unik`);qs.forEach((q,j)=>{if(!q.o.includes(q.a)||new Set(q.o).size!=q.o.length||q.o.length<3)bad.push(`K${g} ${t.n} L${L} #${j+1}: opsi bermasalah`)})}));return`<h1>🧪 Validator Soal</h1><div class=card><div class=big>${tot} soal dibuat</div><p>${bad.length?'⚠️ '+bad.length+' temuan':'✅ Semua soal lolos'}</p><p class=mu>Cek: 25 soal unik per level, jawaban benar ada di opsi, opsi tidak ganda dan minimal 3.</p>${bad.slice(0,40).map(b=>`<div class=mu>⚠️ ${b}</div>`).join('')}</div>`};
if(S){ensure(S);startPresence();pull()}
render();
</script></body></html>
